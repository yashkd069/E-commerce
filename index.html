<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Shop</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
 
<header>
  <h1>🛍️ Mini Shop</h1>
  <button class="cart-btn" id="openCart">🛒 Cart <span id="cartCount">0</span></button>
</header>
 
<main>
  <div class="toolbar" id="filters"></div>
  <div class="grid" id="productGrid"></div>
</main>
 
<!-- Cart drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart">
  <div class="drawer-head"><h2>Your Cart</h2><button class="close" id="closeCart" aria-label="Close cart">×</button></div>
  <div id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Total</span><span id="cartTotal">₹0</span></div>
    <button class="primary" id="checkoutBtn">Checkout</button>
  </div>
</aside>
 
<!-- Checkout modal -->
<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>
 
<div class="toast" id="toast"></div>
 
<script src="script.js"></script>
</body>
</html>
